[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Минималистичный просмотрщик Markdown: рендер + исходник по одной кнопке"
license = "MIT OR Apache-2.0"

[dependencies]
# Оконный каркас + сам GUI. eframe тянет egui как свою зависимость,
# поэтому отдельно egui объявлять не нужно — берём его через eframe::egui.
# Фича persistence — ради сохранения состояния между запусками.
# Пока в ней нужны только ширина и свёрнутость боковой панели; полноценные
# настройки придут на Этапе 2.
eframe = { version = "0.36", features = ["persistence"] }

# Загрузчики картинок: "image" — декодеры, "file" — поддержка file:// URI,
# без которой не покажутся картинки, лежащие рядом с .md файлом.
egui_extras = { version = "0.36", features = ["image", "file"] }

# Собственно рендер Markdown в виджеты egui.
# better_syntax_highlighting = подсветка кода в блоках ``` через syntect.
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }

# Декодеры форматов для картинок. Убирайте лишнее — уменьшится бинарник.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }

# Разбор markdown для оглавления, якорей и поиска по простому тексту.
# Уже есть в дереве как зависимость egui_commonmark, но объявлена явно:
# полагаться на транзитивную нельзя — она может исчезнуть при обновлении.
# Отключаем всё лишнее: нужен только парсер, а не HTML-рендерер и getopts.
pulldown-cmark = { version = "0.13", default-features = false }

# Нативный диалог "открыть файл".
rfd = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
