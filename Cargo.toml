[package]
# Имя пакета задаёт и имя бинарника: target/release/mdglimpse.exe.
# Строчными буквами — так принято в crates.io и так его увидит cargo;
# отображаемое имя «MdGlimpse» живёт отдельно, в интерфейсе и метаданных.
name = "mdglimpse"
version = "0.9.0"
authors = ["algmironov"]
edition = "2021"
rust-version = "1.95"
description = "Минималистичный просмотрщик Markdown: рендер + исходник по одной кнопке"
# Двойное лицензирование — норма для Rust: пользователь берёт любую
# из двух на свой выбор. Тексты обеих лежат в корне, LICENSE-MIT
# и LICENSE-APACHE; эта строка обязана им соответствовать.
license = "MIT OR Apache-2.0"
# Отсюда же берётся ссылка в окне «О программе».
repository = "https://github.com/algmironov/MdGlimpse"

[dependencies]
# Оконный каркас + сам GUI. eframe тянет egui как свою зависимость,
# поэтому отдельно egui объявлять не нужно — берём его через eframe::egui.
# Фича persistence — ради сохранения состояния между запусками.
# Пока в ней нужны только ширина и свёрнутость боковой панели; полноценные
# настройки придут на Этапе 2.
eframe = { version = "0.36", features = ["persistence"] }

# Загрузчики картинок: "image" — декодеры, "file" — поддержка file:// URI,
# без которой не покажутся картинки, лежащие рядом с .md файлом.
egui_extras = { version = "0.36", features = ["image", "file"] }

# Собственно рендер Markdown в виджеты egui.
# better_syntax_highlighting = подсветка кода в блоках ``` через syntect.
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }

# Декодеры форматов для картинок. Убирайте лишнее — уменьшится бинарник.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }

# Разбор markdown для оглавления, якорей и поиска по простому тексту.
# Уже есть в дереве как зависимость egui_commonmark, но объявлена явно:
# полагаться на транзитивную нельзя — она может исчезнуть при обновлении.
# Отключаем всё лишнее: нужен только парсер, а не HTML-рендерер и getopts.
pulldown-cmark = { version = "0.13", default-features = false }

# Сериализация настроек. Уже в дереве — её тянет фича persistence
# у eframe; объявлена явно, потому что мы её используем напрямую.
serde = { version = "1", features = ["derive"] }

# Нативный диалог "открыть файл".
rfd = "0.17"

# Реестр и оповещение оболочки — для регистрации .md за просмотрщиком.
# Крейт уже в дереве: его тянет rfd. Объявлен явно, потому что мы зовём
# его напрямую; перечисленные фичи объединяются с теми, что просит rfd,
# так что новых зависимостей не прибавляется.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Win32_Security нужен не ради безопасности, а потому что за этой фичей
    # в крейте спрятан RegCreateKeyExW: в его сигнатуре есть указатель
    # на SECURITY_ATTRIBUTES, и без фичи функции просто нет.
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# Встраивание иконки и метаданных в .exe. Только на время сборки:
# в бинарник крейт не попадает, в дереве зависимостей приложения его нет.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Только для тестов: тем же ron eframe пишет настройки в хранилище,
# и тест проверяет, что неполная или устаревшая запись переживёт чтение.
# В release-сборку не попадает; в дереве уже есть через eframe/persistence.
ron = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
